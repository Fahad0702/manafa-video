kind = "video"
previewPath = "/manafa-video/"
title = "Manafa SCF Explainer Video"
version = "1.0.0"
id = "artifacts/manafa-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/manafa-video/" ]
localPort = 25407

[services.development]
run = "pnpm --filter @workspace/manafa-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manafa-video", "run", "build" ]
publicDir = "artifacts/manafa-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25407"
BASE_PATH = "/manafa-video/"
